<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LyricsPlus - Pro Theme Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
  <div class="max-w-3xl mx-auto bg-gray-800 p-6 rounded-lg shadow-xl border-2 border-yellow-500">
    <h1 class="text-3xl font-bold text-yellow-500 mb-6">💎 Custom Theme Builder (Pro)</h1>
    
    <div class="grid grid-cols-2 gap-6">
      <!-- Gradient Colors -->
      <div>
        <h2 class="text-xl font-semibold mb-3">Gradient Colors</h2>
        <div class="mb-4">
          <label class="block text-sm mb-1">Color 1 (Start)</label>
          <input type="color" id="gradColor1" class="w-full h-10 border rounded cursor-pointer" value="#ff0000">
        </div>
        <div class="mb-4">
          <label class="block text-sm mb-1">Color 2 (End)</label>
          <input type="color" id="gradColor2" class="w-full h-10 border rounded cursor-pointer" value="#0000ff">
        </div>
        <div class="mb-4">
          <label class="block text-sm mb-1">Gradient Direction (deg)</label>
          <input type="number" id="gradAngle" class="w-full p-2 text-black rounded" value="45" min="0" max="360">
        </div>
      </div>

      <!-- Text Styles -->
      <div>
        <h2 class="text-xl font-semibold mb-3">Text Styles & Animations</h2>
        <div class="mb-4">
          <label class="block text-sm mb-1">Active Lyrics Color</label>
          <input type="color" id="lyricsColor" class="w-full h-10 border rounded cursor-pointer" value="#ffffff">
        </div>
        <div class="mb-4">
          <label class="block text-sm mb-1">Text Shadow/Glow Color</label>
          <input type="color" id="shadowColor" class="w-full h-10 border rounded cursor-pointer" value="#ff00ff">
        </div>
        <div class="mb-4">
          <label class="block text-sm mb-1">Gradient Animation Speed (seconds)</label>
          <input type="number" id="animSpeed" class="w-full p-2 text-black rounded" value="15" min="1" max="100">
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-8 border-t border-gray-600 pt-6 flex gap-4">
      <button id="saveThemeBtn" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded shadow-lg">Save & Apply Theme</button>
      <button id="exportThemeBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded shadow-lg">Export to JSON</button>
      <button id="importThemeBtn" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-4 rounded shadow-lg">Import from JSON</button>
      <input type="file" id="importFile" accept=".json" class="hidden">
    </div>
  </div>

  <script src="theme-builder.js"></script>
</body>
</html>
