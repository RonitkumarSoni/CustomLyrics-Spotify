<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LyricsPlus - Pro Custom Lyrics Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
  <div class="max-w-4xl mx-auto bg-gray-800 p-6 rounded-lg shadow-xl border-2 border-yellow-500">
    <h1 class="text-3xl font-bold text-yellow-500 mb-6">📝 Custom Lyrics Editor (Pro)</h1>
    
    <div class="mb-4">
      <label class="block text-lg font-semibold mb-2">Paste your custom lyrics here:</label>
      <textarea id="customLyricsText" class="w-full h-64 p-4 bg-gray-700 text-white rounded border border-gray-600 font-sans" placeholder="Verse 1..."></textarea>
    </div>

    <div class="mb-6 bg-gray-700 p-4 rounded border border-gray-600">
      <h2 class="text-xl font-semibold mb-2">Time-Sync Settings</h2>
      <p class="text-sm text-gray-400 mb-4">Set how fast the lyrics should auto-scroll from bottom to top (in seconds).</p>
      
      <div class="flex items-center gap-4">
        <input type="range" id="scrollSpeed" min="10" max="300" value="60" class="w-full">
        <span id="speedValue" class="font-bold min-w-[60px]">60s</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="border-t border-gray-600 pt-6 flex gap-4">
      <button id="saveLyricsBtn" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded shadow-lg">Save Custom Lyrics</button>
      <button id="clearBtn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded shadow-lg">Clear</button>
    </div>
  </div>

  <script src="lyrics-editor.js"></script>
</body>
</html>
